<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="50%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#e94560"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#e94560" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="20"/>

  <!-- Border glow -->
  <rect x="4" y="4" width="1192" height="292" rx="18" fill="none" stroke="#e94560" stroke-width="3" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner accents -->
  <text x="30" y="50" font-size="28" fill="#ff6b6b" opacity="0.3">✦</text>
  <text x="1170" y="50" font-size="28" fill="#ff6b6b" opacity="0.3" text-anchor="end">✦</text>
  <text x="30" y="280" font-size="28" fill="#ff6b6b" opacity="0.3">✦</text>
  <text x="1170" y="280" font-size="28" fill="#ff6b6b" opacity="0.3" text-anchor="end">✦</text>

  <!-- Crane line 1 -->
  <text x="600" y="110" font-family="monospace" font-size="22" fill="#8892b0" text-anchor="middle" letter-spacing="8">
    🚧 &lt; UNDER CONSTRUCTION /&gt; 🚧
  </text>

  <!-- Main title -->
  <text x="600" y="185" font-family="Impact, Arial Black, sans-serif" font-size="82" font-weight="bold" text-anchor="middle" fill="url(#glow)" filter="url(#shadow)" letter-spacing="6">
    PROJECT BERJALAN
    <animate attributeName="opacity" values="1;0.7;1" dur="1.5s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="600" y="235" font-family="monospace" font-size="18" fill="#64ffda" text-anchor="middle" letter-spacing="4" opacity="0.7">
    ▸ masih setrika gan... sabar yak! ◂
  </text>

  <!-- Loading dots -->
  <text x="600" y="270" font-family="monospace" font-size="28" fill="#64ffda" text-anchor="middle" letter-spacing="4">
    <tspan>
      .
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0s" repeatCount="indefinite"/>
    </tspan>
    <tspan>
      .
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </tspan>
    <tspan>
      .
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    </tspan>
  </text>

  <!-- Spinning animation bottom -->
  <text x="600" y="50" font-size="20" fill="#e94560" text-anchor="middle" opacity="0.5">
    ⚙
    <animateTransform attributeName="transform" type="rotate" from="0 600 50" to="360 600 50" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
